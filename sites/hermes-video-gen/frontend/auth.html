<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atelier — Enter</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
  <a href="/" class="auth-back">← Atelier</a>

  <main class="auth-container">
    <div class="auth-card">
      <h1 class="auth-title">Atelier</h1>

      <!-- Tabs -->
      <div class="auth-tabs" role="tablist">
        <button class="auth-tab auth-tab--active" data-tab="login" role="tab">Login</button>
        <button class="auth-tab" data-tab="signup" role="tab">Sign Up</button>
      </div>

      <!-- Login form -->
      <form class="auth-form" id="form-login" data-panel="login" novalidate>
        <div class="field">
          <label class="field__label" for="login-email">Email</label>
          <input class="field__input" id="login-email" type="email" autocomplete="email" placeholder="your@email.com">
        </div>
        <div class="field">
          <label class="field__label" for="login-password">Password</label>
          <input class="field__input" id="login-password" type="password" autocomplete="current-password" placeholder="••••••••">
        </div>
        <button type="submit" class="btn-primary auth-submit">Enter</button>
      </form>

      <!-- Signup form -->
      <form class="auth-form auth-form--hidden" id="form-signup" data-panel="signup" novalidate>
        <div class="field">
          <label class="field__label" for="signup-name">Name</label>
          <input class="field__input" id="signup-name" type="text" autocomplete="name" placeholder="Your name">
        </div>
        <div class="field">
          <label class="field__label" for="signup-email">Email</label>
          <input class="field__input" id="signup-email" type="email" autocomplete="email" placeholder="your@email.com">
        </div>
        <div class="field">
          <label class="field__label" for="signup-password">Password</label>
          <input class="field__input" id="signup-password" type="password" autocomplete="new-password" placeholder="••••••••">
        </div>
        <button type="submit" class="btn-primary auth-submit">Create Account</button>
      </form>
    </div>
  </main>

  <script type="module" src="/js/auth.js"></script>
</body>
</html>
