<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atelier — Dashboard</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>
  <!-- TOP NAV -->
  <header class="dash-nav">
    <a href="/" class="dash-nav__wordmark">Atelier</a>
    <nav class="dash-nav__links">
      <button class="dash-nav__link" data-view="create">Create</button>
      <button class="dash-nav__link dash-nav__link--active" data-view="videos">My Videos</button>
    </nav>
    <button class="dash-nav__logout btn-ghost" id="btn-logout">Sign Out</button>
  </header>

  <!-- MAIN CONTENT AREA -->
  <main class="dash-main">

    <!-- CREATE PANEL — hidden by default, shown in Task 9 -->
    <section class="dash-view" id="view-create" hidden>
      <!-- populated by Task 9 -->
    </section>

    <!-- MY VIDEOS VIEW -->
    <section class="dash-view" id="view-videos">
      <div class="dash-view__header">
        <h2 class="dash-view__title">My Videos</h2>
      </div>
      <div class="video-grid" id="video-grid">
        <!-- cards rendered by JS -->
      </div>
      <p class="empty-state" id="empty-state" hidden>No videos yet. Create your first.</p>
    </section>

  </main>

  <!-- VIDEO MODAL — structure added by Task 10 -->
  <div class="modal-overlay" id="modal" hidden>
    <!-- populated by Task 10 -->
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script type="module" src="/js/dashboard.js"></script>
  <script type="module" src="/js/create.js"></script>
  <script type="module" src="/js/modal.js"></script>
</body>
</html>
