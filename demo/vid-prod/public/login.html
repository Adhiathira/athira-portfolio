<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — Create Together</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/typography.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <style>
    .auth-navbar { justify-content: center; }
    .auth-navbar .navbar__logo { flex: none; }

    body {
      background: var(--color-surface);
      min-height: 100vh;
    }
    .auth-body {
      min-height: calc(100vh - 60px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--spacing-section-gap) var(--spacing-nav-h);
    }
    .auth-card {
      max-width: 480px;
      width: 100%;
      background: var(--color-bg);
      border: 1px solid var(--color-border);
      border-radius: var(--spacing-wrapper-radius);
      padding: 48px;
    }
    .auth-card__logo {
      display: flex;
      justify-content: center;
      margin-bottom: var(--spacing-section-gap);
    }
    .auth-card__heading {
      font-family: var(--font-family);
      font-size: var(--font-size-h2);
      font-weight: var(--font-weight-h2);
      line-height: var(--line-height-h2);
      letter-spacing: var(--letter-spacing-h2);
      color: var(--color-heading);
      margin: 0 0 var(--spacing-btn-gap);
      text-align: center;
    }
    .auth-card__subtitle {
      font-family: var(--font-family);
      font-size: var(--font-size-body);
      color: var(--color-muted);
      text-align: center;
      margin: 0 0 var(--spacing-section-gap);
    }
    .auth-divider {
      display: flex;
      align-items: center;
      gap: var(--spacing-btn-gap);
      margin: var(--spacing-section-gap) 0;
      color: var(--color-muted);
      font-family: var(--font-family);
      font-size: var(--font-size-button);
    }
    .auth-divider::before,
    .auth-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--color-border);
    }
    .form-group {
      margin-bottom: var(--spacing-section-gap);
    }
    .form-label {
      display: block;
      font-family: var(--font-family);
      font-size: var(--font-size-button);
      font-weight: 500;
      color: var(--color-heading);
      margin-bottom: var(--spacing-btn-gap);
    }
    .form-input {
      width: 100%;
      padding: var(--spacing-btn-top) var(--spacing-btn-right) var(--spacing-btn-bottom) var(--spacing-btn-left);
      border: 1px solid var(--color-border);
      border-radius: var(--spacing-btn-radius);
      font-family: var(--font-family);
      font-size: var(--font-size-body);
      color: var(--color-heading);
      background: var(--color-bg);
      box-sizing: border-box;
      transition: var(--motion-btn);
      outline: none;
    }
    .form-input:focus {
      border-color: var(--color-interactive);
      box-shadow: 0 0 0 3px rgba(83, 58, 253, 0.12);
    }
    .field-error {
      display: block;
      color: var(--color-error);
      font-family: var(--font-family);
      font-size: var(--font-size-button);
      margin-top: var(--spacing-btn-gap);
      min-height: 0;
    }
    .field-error:empty { display: none; }
    .btn-full { width: 100%; justify-content: center; }
    .auth-card__footer {
      margin-top: var(--spacing-section-gap);
      text-align: center;
      font-family: var(--font-family);
      font-size: var(--font-size-button);
      color: var(--color-muted);
    }
    .auth-card__footer a {
      color: var(--color-interactive);
      text-decoration: none;
    }
    .auth-card__footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <nav class="navbar auth-navbar">
    <a href="index.html" class="navbar__logo">Create Together</a>
  </nav>
  <div class="navbar-spacer"></div>

  <div class="auth-body">
    <div class="auth-card">

      <div class="auth-card__logo">
        <a href="index.html" class="navbar__logo">Create Together</a>
      </div>

      <h2 class="auth-card__heading">Welcome back</h2>
      <p class="auth-card__subtitle">Sign in to your vid-prod workspace</p>

      <button type="button" class="btn btn-secondary btn-full" id="oauth-btn">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M17.64 9.205c0-.639-.057-1.252-.164-1.841H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615Z" fill="#4285F4"/>
          <path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18Z" fill="#34A853"/>
          <path d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332Z" fill="#FBBC05"/>
          <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58Z" fill="#EA4335"/>
        </svg>
        Continue with Google
      </button>

      <div class="auth-divider">or</div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="email" class="form-label">Email</label>
          <input type="email" id="email" class="form-input" placeholder="you@example.com" autocomplete="email">
          <span class="field-error" id="email-error"></span>
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <input type="password" id="password" class="form-input" placeholder="Your password" autocomplete="current-password">
          <span class="field-error" id="password-error"></span>
        </div>

        <button type="submit" class="btn btn-primary btn-full">Sign in</button>
      </form>

      <div class="auth-card__footer">
        Don't have an account? <a href="signup.html">Sign up &rarr;</a>
      </div>

    </div>
  </div>

  <script type="module">
    import { isLoggedIn, loginAs } from '../js/auth.js';

    if (isLoggedIn()) {
      window.location.href = '/app/studio.html';
    }
    const rawReturnTo = new URLSearchParams(window.location.search).get('returnTo');
    const returnTo = (rawReturnTo && rawReturnTo.startsWith('/') && !rawReturnTo.startsWith('//')) ? rawReturnTo : '/app/studio.html';

    document.getElementById('oauth-btn').addEventListener('click', () => {
      alert('Google sign-in is not available in this demo.');
    });

    document.getElementById('login-form').addEventListener('submit', (e) => {
      e.preventDefault();

      const emailInput = document.getElementById('email');
      const passwordInput = document.getElementById('password');
      const emailError = document.getElementById('email-error');
      const passwordError = document.getElementById('password-error');

      // Clear previous errors
      emailError.textContent = '';
      passwordError.textContent = '';

      let hasError = false;

      // Validate email
      const emailVal = emailInput.value.trim();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailVal)) {
        emailError.textContent = 'Please enter a valid email address';
        hasError = true;
      }

      // Validate password
      const passwordVal = passwordInput.value;
      if (!passwordVal) {
        passwordError.textContent = 'Password is required';
        hasError = true;
      }

      if (hasError) return;

      loginAs(emailVal.split('@')[0]);
      window.location.href = returnTo;
    });
  </script>
  <script src="../js/scroll.js"></script>

</body>
</html>
