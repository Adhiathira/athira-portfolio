<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GoyardVid — Log in</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/typography.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/nav.css">
  <link rel="stylesheet" href="css/pages/auth.css">
</head>
<body class="auth-page">

  <!-- NAV -->
  <header class="site-nav nav--minimal" role="banner">

    <div class="nav-utility-bar">
      <div class="nav-utility-left">
        <button class="nav-icon-btn" aria-label="Search">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.5"/>
            <line x1="10.5" y1="10.5" x2="13.5" y2="13.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
        <button class="nav-icon-btn" aria-label="Language">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <circle cx="8" cy="8" r="5.5" stroke="currentColor" stroke-width="1.5"/>
            <ellipse cx="8" cy="8" rx="2.5" ry="5.5" stroke="currentColor" stroke-width="1.5"/>
            <line x1="2.5" y1="8" x2="13.5" y2="8" stroke="currentColor" stroke-width="1.5"/>
          </svg>
        </button>
      </div>

      <a href="index.html" class="nav-wordmark">
        <span class="nav-logo-text">GOYARDVID</span>
      </a>

      <div class="nav-utility-right">
        <button class="nav-icon-btn" aria-label="Account">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <circle cx="8" cy="5.5" r="2.5" stroke="currentColor" stroke-width="1.5"/>
            <path d="M2.5 13.5C2.5 11 5 9.5 8 9.5s5.5 1.5 5.5 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- nav--minimal hides the primary bar entirely (display: none in auth.css) -->
    <nav class="nav-primary-bar" aria-label="Primary navigation">
      <div class="nav-links">
        <a href="index.html" class="nav-link">Create</a>
        <a href="explore.html" class="nav-link">Explore</a>
        <a href="pricing.html" class="nav-link">Pricing</a>
        <a href="about.html" class="nav-link">About</a>
      </div>
      <div class="nav-auth">
        <a href="login.html" class="nav-login nav-link--active">Log in</a>
        <a href="signup.html" class="nav-join">Join</a>
      </div>
    </nav>

  </header>

  <main class="auth-main">
    <div class="auth-card">

      <h1 class="auth-card-title">Log in</h1>

      <form action="#" method="post" novalidate>

        <!-- Email field -->
        <div class="auth-field">
          <label class="auth-label" for="login-email">Email</label>
          <input
            class="auth-input"
            type="email"
            id="login-email"
            name="email"
            autocomplete="email"
            placeholder=""
          >
          <span class="error-message" role="alert">Please enter a valid email address.</span>
        </div>

        <!-- Password field -->
        <div class="auth-field">
          <label class="auth-label" for="login-password">Password</label>
          <input
            class="auth-input"
            type="password"
            id="login-password"
            name="password"
            autocomplete="current-password"
            placeholder=""
          >
          <span class="error-message" role="alert">Please enter your password.</span>
        </div>

        <!-- CTA group -->
        <div class="auth-cta-group">
          <button type="submit" class="auth-btn-primary">Log in</button>
          <button type="button" class="auth-btn-secondary">Continue with Google</button>
        </div>

      </form>

      <!-- Switch link -->
      <p class="auth-switch-link">
        Don't have an account? <a href="signup.html">Create one</a>
      </p>

    </div>
  </main>

<script>
  document.querySelector('form').addEventListener('submit', function(e) {
    e.preventDefault();
    window.location.href = 'explore.html';
  });
</script>
</body>
</html>
