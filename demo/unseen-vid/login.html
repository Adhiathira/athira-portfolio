<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in — unseen-vid</title>
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/auth.css">
</head>
<body class="auth-page">

  <div class="auth-cluster">

    <!-- Brand mark -->
    <div class="auth-cluster__brand">unseen-vid</div>

    <!-- Framing text — "continuity" emotional state per blueprint.md -->
    <p class="auth-cluster__frame">Welcome back.</p>

    <!-- Login form -->
    <form class="auth-form" id="loginForm" onsubmit="handleLogin(event)">
      <label for="login-email" class="sr-only">Email</label>
      <input
        type="email"
        id="login-email"
        name="email"
        placeholder="Email"
        required
        class="auth-input"
        autocomplete="email"
      >
      <label for="login-password" class="sr-only">Password</label>
      <input
        type="password"
        id="login-password"
        name="password"
        placeholder="Password"
        required
        class="auth-input"
        autocomplete="current-password"
      >
      <button type="submit" class="cta-primary">Continue</button>
    </form>

    <!-- OAuth options — login has Google only (not GitHub) -->
    <div class="auth-oauth">
      <span class="auth-oauth__label">or</span>
      <button type="button" class="auth-oauth__btn" onclick="handleOAuthMock('google')">Continue with Google</button>
    </div>

    <!-- Secondary path -->
    <p class="auth-cluster__switch">New here? <a href="/signup.html">Create an account</a></p>

  </div>

  <script src="js/shared.js"></script>
</body>
</html>
