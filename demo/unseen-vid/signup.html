<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join unseen-vid</title>
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/auth.css">
</head>
<body class="auth-page">

  <div class="auth-cluster">

    <!-- Brand mark -->
    <div class="auth-cluster__brand">unseen-vid</div>

    <!-- Framing text — "threshold" emotional state per blueprint.md -->
    <p class="auth-cluster__frame">You're one step from making something.</p>

    <!-- Signup form -->
    <form class="auth-form" id="signupForm" onsubmit="handleSignup(event)">
      <label for="signup-email" class="sr-only">Email</label>
      <input
        type="email"
        id="signup-email"
        name="email"
        placeholder="Email"
        required
        class="auth-input"
        autocomplete="email"
      >
      <label for="signup-password" class="sr-only">Password</label>
      <input
        type="password"
        id="signup-password"
        name="password"
        placeholder="Password"
        required
        minlength="8"
        class="auth-input"
        autocomplete="new-password"
      >
      <button type="submit" class="cta-primary">Start creating</button>
    </form>

    <!-- OAuth options -->
    <div class="auth-oauth">
      <span class="auth-oauth__label">or</span>
      <button type="button" class="auth-oauth__btn" onclick="handleOAuthMock('google')">Continue with Google</button>
      <button type="button" class="auth-oauth__btn" onclick="handleOAuthMock('github')">Continue with GitHub</button>
    </div>

    <!-- Secondary path -->
    <p class="auth-cluster__switch">Already have an account? <a href="/login.html">Log in</a></p>

  </div>

  <script src="js/shared.js"></script>
</body>
</html>
